apiVersion: apps/v1
kind: Deployment
metadata:
  name: tot-debugging
  namespace: tot-debugging
  labels:
    app: tot-debugging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tot-debugging
  template:
    metadata:
      labels:
        app: tot-debugging
    spec:
      containers:
        - name: app
          image: REGISTRY_IMAGE_PLACEHOLDER
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
              name: http
          envFrom:
            - configMapRef:
                name: tot-debugging-config
            - secretRef:
                name: tot-debugging-secret
          livenessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
---

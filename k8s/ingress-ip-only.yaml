# Ingress for IP-only access (no domain). Replace YOUR_INGRESS_IP with your NGINX Ingress controller external IP.
# Users open https://<YOUR_INGRESS_IP>
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tot-debugging-ingress
  namespace: tot-debugging
  labels:
    app: tot-debugging
  annotations:
    nginx.ingress.kubernetes.io/upstream-hash-by: "$http_x_session_id"
    nginx.ingress.kubernetes.io/affinity: "cookie"
    nginx.ingress.kubernetes.io/session-cookie-name: "TOT_SESSION"
    nginx.ingress.kubernetes.io/session-cookie-expires: "172800"
    nginx.ingress.kubernetes.io/session-cookie-max-age: "172800"
spec:
  ingressClassName: nginx
  rules:
    # No host = matches any Host header (e.g. when user opens https://<IP>)
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tot-debugging
                port:
                  number: 80
  tls:
    - hosts:
        - YOUR_INGRESS_IP   # Replace with your Ingress controller external IP (e.g. 34.120.45.67)
      secretName: tot-debugging-tls
